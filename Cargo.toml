[package]
name = "winflex-crypto"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Внешняя компонента 1С (Native API): подпись Ed25519, шифрование на открытый ключ (libsodium sealed box), шифрование паролем (Argon2id + XChaCha20-Poly1305)"
repository = "https://github.com/viollan/winflex-crypto"

[lib]
name = "winflex_crypto"
crate-type = ["cdylib", "rlib"]

[dependencies]
addin1c = "0.7"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
crypto_box = { version = "0.9", features = ["seal", "std"] }
ed25519-dalek = "2.1"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"   # компонента перехватывает панику на границе с платформой
strip = true
